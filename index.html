<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Mapa Integrado da Educação — Cabo Frio</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><style>body{font:16px system-ui;background:#f2f6f8;color:#18394e;margin:0}header{background:white;padding:20px;border-bottom:5px solid #e6a244}main{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:15px}.panel{background:white;border-radius:12px;padding:15px}#map{height:500px}button{display:block;width:100%;padding:12px;margin:7px 0;text-align:left;border:0;background:#e7f3f6;border-radius:7px;cursor:pointer}.note{background:#fff2d7;padding:12px;margin-bottom:15px}#details{margin-top:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}#map{height:400px}}</style></head><body><header><h2>Mapa Integrado da Educação de Cabo Frio</h2><p>Protótipo de demonstração</p></header><main><div class='note'>Os marcadores são referências aproximadas por região, não localizações escolares verificadas. Nenhum dado interno real é exibido.</div><div class='grid'><section class='panel'><h3>Mapa geográfico</h3><div id='map'></div><p id='status'>Carregando mapa…</p></section><section class='panel'><h3>Escolas do piloto</h3><div id='list'></div><div id='details'>Selecione uma escola para visualizar a ficha.</div></section></div></main><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>const schools=[['E.M. Professor Edilson Duarte','Jardim Caiçara',-22.879,-42.029],['E.M. Professora Amena Mayall','Guarani',-22.894,-42.030],['E.M. Professora Talita Hernandes Perelló','Jardim Esperança',-22.839,-42.050],['Escola Agrícola Municipal Nilo Batista','Tamoios',-22.671,-42.013],['C.E.M. Professora Marli Capp','Unamar / Tamoios',-22.650,-41.995]];let map,markers=[];function show(i){let s=schools[i];document.getElementById('details').innerHTML='<h3>'+s[0]+'</h3><p>Região: '+s[1]+'</p><p>Endereço, contato e modalidades aguardam validação.</p><h4>Área interna — apenas simulação</h4><p>📁 Tecnologia<br>📁 Infraestrutura<br>📁 Gestão<br>📁 Pedagógico</p>';if(map){map.setView([s[2],s[3]],14);markers[i].openPopup()}}document.getElementById('list').innerHTML=schools.map((s,i)=>'<button onclick="show('+i+')">'+s[0]+' — '+s[1]+'</button>').join('');try{map=L.map('map').setView([-22.78,-42.03],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);schools.forEach((s,i)=>{let m=L.marker([s[2],s[3]]).addTo(map).bindPopup(s[0]+' (posição aproximada)');m.on('click',()=>show(i));markers.push(m)});document.getElementById('status').textContent='Mapa OpenStreetMap — posições aproximadas.'}catch(e){document.getElementById('status').textContent='Mapa indisponível. Abra pelo Chrome com internet.'}</script></body></html>
